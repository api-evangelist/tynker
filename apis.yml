description: Tynker is a coding platform for kids and teens ages 5-18 that makes it
  fun to learn programming through game-based, interactive courses, with students
  starting in visual block-based coding and progressing to real-world languages like
  Python and JavaScript. The platform powers the creativity of over 100 million students
  and serves thousands of schools and educators worldwide, spanning home plans for
  parents, K-12 school curriculum, Hour of Code activities, and Minecraft modding.
  Tynker is a 500 Global and Felicis portfolio company, now part of CodeHS, and publishes
  no public developer API surface.
